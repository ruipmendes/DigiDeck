name: CI

# Typecheck + build on push + PR, across Windows / macOS / Ubuntu.
# Catches cross-platform regressions (platform-specific imports, path case,
# missing shims) before they land on main. No tests run yet — we don't have
# a suite — but TypeScript + `vite build` cover the common fault modes.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'metrics/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Typecheck server
        working-directory: server
        run: npx tsc --noEmit

      - name: Typecheck client
        working-directory: client
        run: npx tsc --noEmit

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Build client
        working-directory: client
        run: npm run build
